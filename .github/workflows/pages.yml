name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      # Her yayın kendi sürüm klasörüne konur (v/<commit>/). Böylece tarayıcı önbelleği eski ve yeni
      # dosyaları karıştıramaz: sayfa her zaman tek bir sürümün tüm dosyalarını birlikte yükler.
      - run: |
          V=${GITHUB_SHA::8}
          mkdir -p _site/v/$V
          cp -r index.html assets docs _site/
          cp -r src styles.css _site/v/$V/
          sed -i "s#href=\"styles.css\"#href=\"v/$V/styles.css\"#; s#src=\"src/app.js\"#src=\"v/$V/src/app.js\"#; s#content=\"dev\"#content=\"$V\"#" _site/index.html
          grep -q "v/$V/src/app.js" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
